    <rect x="200" y="24" width="14" height="4" rx="2" fill="#d9a23a"/><text x="222" y="31" fill="#16212d">Média da região</text>
    <rect x="370" y="24" width="14" height="4" rx="2" fill="#7fa6d6"/><text x="392" y="31" fill="#16212d">Média do estado</text>
